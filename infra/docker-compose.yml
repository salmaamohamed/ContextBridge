version: "3.9"

services:
  api:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ../backend:/app

  worker:
    build:
      context: ../backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - ../backend/.env
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ../backend:/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: contextbridge
      POSTGRES_PASSWORD: contextbridge
      POSTGRES_DB: contextbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
