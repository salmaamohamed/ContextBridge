<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>ContextBridge system architecture</title>
<desc>Clients and integrations call an API and orchestrator, which runs eight agents grouped by type, using shared AI services over three data stores, fed by an ingestion pipeline.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="600" fill="#ffffff"/>

<!-- Row 1: clients and integrations -->
<rect x="40" y="20" width="135" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="107" y="40" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Employee</text><text x="107" y="58" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">web app</text>
<rect x="195" y="20" width="135" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="262" y="40" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Supervisor</text><text x="262" y="58" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">dashboard</text>
<rect x="350" y="20" width="135" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="417" y="40" font-size="14" font-weight="600" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Seniors</text><text x="417" y="58" font-size="12" fill="#712B13" text-anchor="middle" dominant-baseline="central">Microsoft Teams</text>
<rect x="505" y="20" width="135" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="572" y="40" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Jira + Medium</text><text x="572" y="58" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">tasks, reading links</text>
<g stroke="#6b7280" stroke-width="1.5" fill="none">
<line x1="107" y1="72" x2="107" y2="106" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="262" y1="72" x2="262" y2="106" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="417" y1="72" x2="417" y2="106" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="572" y1="72" x2="572" y2="106" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</g>

<!-- Row 2: API + orchestrator -->
<rect x="40" y="108" width="600" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="340" y="127" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">API + Orchestrator</text><text x="340" y="146" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">auth · intent router · event log · wakes the right agent</text>
<g stroke="#6b7280" stroke-width="1.5" fill="none">
<line x1="135" y1="160" x2="135" y2="188" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="340" y1="160" x2="340" y2="188" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="545" y1="160" x2="545" y2="188" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</g>

<!-- Row 3: agents by type -->
<rect x="40" y="190" width="190" height="132" rx="10" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="135" y="206" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Agents · decide</text>
<rect x="52" y="220" width="166" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="135" y="234" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">Path</text>
<rect x="52" y="254" width="166" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="135" y="268" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">Support</text>
<rect x="52" y="288" width="166" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="135" y="302" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">KB curator</text>

<rect x="245" y="190" width="190" height="132" rx="10" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="340" y="206" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">LLM workflows · fixed steps</text>
<rect x="257" y="220" width="166" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340" y="234" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle" dominant-baseline="central">Assistant</text>
<rect x="257" y="254" width="166" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340" y="268" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle" dominant-baseline="central">Simulation</text>
<rect x="257" y="288" width="166" height="28" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="340" y="302" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle" dominant-baseline="central">Assessment</text>

<rect x="450" y="190" width="190" height="132" rx="10" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/><text x="545" y="206" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Services · no LLM</text>
<rect x="462" y="220" width="166" height="28" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="545" y="234" font-size="14" font-weight="600" fill="#4B1528" text-anchor="middle" dominant-baseline="central">Progress</text>
<rect x="462" y="254" width="166" height="28" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="1"/><text x="545" y="268" font-size="14" font-weight="600" fill="#4B1528" text-anchor="middle" dominant-baseline="central">Escalation</text>

<line x1="340" y1="322" x2="340" y2="350" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Row 4: AI services -->
<rect x="40" y="352" width="186" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="133" y="370" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">RAG service</text><text x="133" y="388" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">hybrid search + rerank</text>
<rect x="247" y="352" width="186" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340" y="370" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">LLM gateway</text><text x="340" y="388" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Qwen text + vision</text>
<rect x="454" y="352" width="186" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="547" y="370" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Guardrails</text><text x="547" y="388" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">no source = escalate</text>
<line x1="340" y1="400" x2="340" y2="428" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Row 5: data stores -->
<rect x="40" y="430" width="186" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="133" y="449" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle" dominant-baseline="central">Qdrant</text><text x="133" y="467" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">company · project · FAQ</text>
<rect x="247" y="430" width="186" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340" y="449" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text x="340" y="467" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">employees · tasks · events</text>
<rect x="454" y="430" width="186" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="547" y="449" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Object store</text><text x="547" y="467" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">original files, images</text>

<!-- Ingestion -->
<line x1="133" y1="512" x2="133" y2="484" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="514" width="186" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="133" y="532" font-size="14" font-weight="600" fill="#04342C" text-anchor="middle" dominant-baseline="central">Ingestion pipeline</text><text x="133" y="550" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">parse · chunk · embed</text>
<text x="247" y="538" font-size="12" fill="#5F5E5A" dominant-baseline="central">documents in → vectors to Qdrant, originals to object store</text>

<text x="340" y="588" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Purple: agents · Teal: LLM workflows and knowledge · Pink: services · Coral: humans</text>
</svg>
